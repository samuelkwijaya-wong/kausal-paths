    from_dimensions:
    - id: lacap_sector
      categories: [residential]
      flatten: true
  output_nodes:
  - id: lacap_emissions
    to_dimensions:
    - id: lacap_sector
      categories: [residential]
    - id: ie_energy_carrier

- id: lacap_commercial_emissions
