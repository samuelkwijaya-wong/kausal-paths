# ---------------------------------------------------------------------------
# Project-level planning (plan section 8): named projects are a part of their
# action, never added on top. The remainder shows what is not yet tied to a project.

- id: ddhs_phase_1_homes
  name_en: 'Project: Dublin District Heating phase 1 (homes connected)'
  description_en: Home-equivalents connected by phase 1 of the Dublin District Heating System
    (Poolbeg–Ringsend). A part of action R3.1.
  type: generic.GenericNode
  quantity: number
  unit: dimensionless
  input_datasets:
  - id: nzc-ie/project_targets
    column: ddhs_phase_1_homes
    forecast_from: 2024
  output_nodes:
  - id: r3_1_homes_not_tied_to_projects
    tags: [arithmetic_inverse]

- id: r3_1_homes_not_tied_to_projects
  name_en: R3.1 homes not yet tied to a named project
  description_en: Action R3.1 target minus named projects. A negative value means the projects add up
    to more than the action and should be checked.
  type: generic.GenericNode
  quantity: number
  unit: dimensionless

# ---------------------------------------------------------------------------
# Suggested values for the NetZeroCities data collection form. A Mission city
# that also keeps a LACAP inventory gets these as pre-filled default values
# (python manage.py prefill_nzc_from_lacap); the city confirms or corrects them,
# and a value the city enters always wins. Passenger-km and freight tonne-km are
# not suggested: they count trips, which the fuel-based inventory cannot give.

- id: nzc_suggested_building_heat
  name_en: 'NetZeroCities form: suggested building heat energy use'
  description_en: Fuel used in homes and in commercial and public buildings (natural gas, heating oil,
    LPG and solid fuels). A starting point for the form's space heating and hot water total. It leaves
    out electric heating and includes some cooking, so the city should check it.
  type: simple.AdditiveNode
  quantity: energy
  unit: GWh/a
  input_dimensions: [ie_energy_carrier]
  output_dimensions: [ie_energy_carrier]
  input_nodes:
  - id: ie_energy_consumption
    from_dimensions:
    - id: lacap_sector
      categories: [residential, commercial]
      flatten: true
    - id: ie_energy_carrier
      categories: [natural_gas, heating_oil, lpg, solid_fuels]

- id: nzc_suggested_electricity
  name_en: 'NetZeroCities form: suggested electricity consumption'
  description_en: Electricity used in the city in all LACAP sectors, for the form's total electricity
    demand within city boundaries.
  type: simple.AdditiveNode
  quantity: energy
  unit: GWh/a
  input_dimensions: [lacap_sector]
  output_dimensions: [lacap_sector]
  input_nodes:
  - id: ie_energy_consumption
    from_dimensions:
    - id: ie_energy_carrier
      categories: [electricity]
      flatten: true

- id: nzc_suggested_other_sectors
  name_en: 'NetZeroCities form: suggested emissions from other sectors'
  description_en: Industrial processes, F-gases, agriculture and land use from the LACAP inventory.
    These are the rows NetZeroCities does not model itself (the same rows as in the LACAP-to-NZC crosswalk).
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [lacap_sector]
  output_dimensions: [lacap_sector]
  input_nodes:
  - id: ie_direct_emissions
    from_dimensions:
    - id: lacap_sector
      categories: [industrial_processes, f_gases, agriculture, lulucf]
    - id: ie_energy_carrier
      flatten: true

actions:

- id: r1_social_housing_retrofit
  name_en: R1 Social housing regeneration and retrofit
  description_en: Retrofit council homes to BER B2 with heat pumps, starting with the flagship
    regenerations (Dominick Street Lower, Oliver Bond House, Constitution Hill, Pearse House).
    KPI is homes retrofitted. Plan p.12 and pp.38–39; national CAP BE/23/11, BE/23/25.
  type: simple.AdditiveAction
  group: resilient_city
  quantity: number
  unit: dimensionless
  input_datasets:
  - id: nzc-ie/action_targets
    column: r1_social_housing_homes
    forecast_from: 2024
  input_dataset_processors: [LinearInterpolation]
  output_nodes:
  - id: r1_social_housing_impact
    tags: [non_additive]
    to_dimensions: []

- id: r2_public_buildings_pathfinder
  name_en: R2 Public buildings regeneration (Pathfinder)
  description_en: Deep retrofit of council buildings (Civic Offices, Mansion House, City Hall) and the
    SEAI Pathfinder programme. KPI is buildings upgraded. Plan p.39; national CAP BE/23/30–39.
  type: simple.AdditiveAction
  group: resilient_city
  quantity: number
  unit: dimensionless
  input_datasets:
  - id: nzc-ie/action_targets
