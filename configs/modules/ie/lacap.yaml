# Irish Local Authority Climate Action Plan (LACAP) core module.
#
# Builds the Irish inventory view (DECC Guidelines for LA Climate Action Plans,
# Technical Annex C, March 2023) and a GPC view (CDP-ICLEI reporting) from one
# set of inputs. It runs on its own (configs/ie-lacap-dublin.yaml) or next to
# nzc.yaml (configs/nzc-ie.yaml), where it is shown side by side with
# net_emissions and not connected to it (docs/nzp-city-inventory-compliance-pattern.md, Step 3).
#
# Settings that the 2029 LACAP guidance may change live in one place:
# - the lacap_sector category list (below)
# - the crosswalk datasets (nzc-ie/crosswalk_lacap_gpc, nzc-ie/crosswalk_lacap_nzc)
# - base year and goals (in the including instance file)
#
# Datasets: configs/data/nzc-ie/*.csv, published as nzc-ie/<name>. See configs/data/nzc-ie/README.md.
#
# Required from the including file: dimension `scope` (scope1, scope2, scope3),
# action groups resilient_city, resource_full_city, social_city, national.

