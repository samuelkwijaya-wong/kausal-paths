nodes:

# ---------------------------------------------------------------------------
# Activity and factors

- id: ie_population
  name_en: Population
  type: generic.GenericNode
  quantity: population
  unit: cap
  input_datasets:
  - id: nzc-ie/population
    column: population
    forecast_from: 2023

- id: ie_energy_consumption
  name_en: Energy use by sector and carrier
  description_en: Final energy use in the city by LACAP sector and energy carrier (Annex C Tier 2
    table). Held at the base-year level in the baseline; actions change it.
  type: generic.GenericNode
  quantity: energy
  unit: GWh/a
  input_dimensions: [lacap_sector, ie_energy_carrier]
  output_dimensions: [lacap_sector, ie_energy_carrier]
  input_datasets:
  - id: nzc-ie/energy_inventory
    column: energy
    forecast_from: 2019

- id: ie_emission_factors
  name_en: Emission factors
  description_en: SEAI conversion factors for fuels, and the national grid CO2 intensity for
    electricity (LACAP Step 2). The grid path after 2018 is an estimate of national decarbonisation.
  type: generic.GenericNode
  quantity: emission_factor
  unit: t/MWh
  input_dimensions: [ie_energy_carrier]
  output_dimensions: [ie_energy_carrier]
  input_datasets:
  - id: nzc-ie/emission_factors
    column: emission_factor
    forecast_from: 2019

# ---------------------------------------------------------------------------
# Emissions

- id: ie_energy_emissions
  name_en: Energy emissions
  description_en: Energy use × emission factor. Electricity is counted where it is used
    (LACAP Step 2).
  type: generic.GenericNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [lacap_sector, ie_energy_carrier]
  output_dimensions: [lacap_sector, ie_energy_carrier]
  input_nodes:
  - id: ie_energy_consumption
  - id: ie_emission_factors
    tags: [non_additive]
    to_dimensions:
    - id: ie_energy_carrier

- id: ie_direct_emissions
  name_en: Non-energy emissions
  description_en: Emissions entered directly (plan decision C) for waste and wastewater, F-gases,
    industrial processes, agriculture and land use.
  type: generic.GenericNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [lacap_sector, ie_energy_carrier]
  output_dimensions: [lacap_sector, ie_energy_carrier]
  input_datasets:
  - id: nzc-ie/direct_emissions
    column: emissions
    forecast_from: 2019

# One node per LACAP sector, so the public UI shows the inventory sectors
# as subsectors of lacap_emissions (each opens into its energy carrier split).

- id: lacap_residential_emissions
  name_en: Residential
  color: '#4e79a7'
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [ie_energy_carrier]
  output_dimensions: [ie_energy_carrier]
  input_nodes:
