  name_en: Land use, land-use change and forestry
  color: '#8cd17d'
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [ie_energy_carrier]
  output_dimensions: [ie_energy_carrier]
  input_nodes:
  - id: ie_direct_emissions
    from_dimensions:
    - id: lacap_sector
      categories: [lulucf]
      flatten: true
  output_nodes:
  - id: lacap_emissions
    to_dimensions:
    - id: lacap_sector
      categories: [lulucf]
    - id: ie_energy_carrier

- id: lacap_emissions
  name_en: Dublin City emissions (LACAP inventory)
  description_en: |
    <p>Territorial emissions in the sectors of the DECC LACAP guidance (Annex C), with electricity
    reallocated to the sectors that use it (Step 2). This is the view the headline goal is measured on:
    −51% by 2030 compared with 2018, and climate neutrality by 2050.</p>
    <p>Demo data: the 2018 total (2,183,270 tCO2e) is from the Dublin City Climate Action Plan
    2024–2029, p.67. The split by sector and fuel is partly estimated; see the data notes.</p>
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt/a
  is_outcome: true
  input_dimensions: [lacap_sector, ie_energy_carrier]
  output_dimensions: [lacap_sector, ie_energy_carrier]

- id: energy_industries_step1
  name_en: Energy industries in the city (LACAP Step 1)
  description_en: |
    <p>Emissions at power and heat plants inside the city boundary (Annex C Step 1). Reported next to
    the inventory but not added to it, because Step 2 already counts electricity where it is used.</p>
    <p>Demo value: Dublin Waste-to-Energy at Poolbeg only, estimated. Gas-fired power stations are
    not yet included.</p>
  type: generic.GenericNode
  quantity: emissions
  unit: kt/a
  is_outcome: true
  input_dimensions: [lacap_sector, ie_energy_carrier]
  output_dimensions: [lacap_sector, ie_energy_carrier]
  input_datasets:
  - id: nzc-ie/energy_industries
    column: emissions
    forecast_from: 2019

- id: council_operations_emissions
  name_en: Council's own emissions
  description_en: Emissions from Dublin City Council's buildings, public lighting and fleet (SEAI
    monitoring and reporting). A part of the city total, never added to it. Plan pp.65–67.
  type: generic.GenericNode
  quantity: emissions
  unit: t/a
  is_outcome: true
  input_dimensions: [council_energy_carrier]
  output_dimensions: [council_energy_carrier]
  input_datasets:
  - id: nzc-ie/council_operations
    column: emissions
    forecast_from: 2022
  goals:
  - label_en: Public sector goal (−51% by 2030 vs 2018)
    linear_interpolation: true
    values:
    - year: 2018
      value: 38326
    - year: 2030
      value: 18780

# ---------------------------------------------------------------------------
# GPC view for CDP-ICLEI reporting

- id: lacap_gpc_crosswalk
  name_en: Crosswalk from LACAP to GPC
  description_en: Settings table that says which GPC sector and scope each LACAP row belongs to.
  type: generic.GenericNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [lacap_sector, ie_energy_carrier, gpc_sector, scope]
  output_dimensions: [lacap_sector, ie_energy_carrier, gpc_sector, scope]
  input_datasets:
  - id: nzc-ie/crosswalk_lacap_gpc
    column: share
    forecast_from: 2019

- id: gpc_emissions_by_lacap_row
  name_en: GPC emissions by LACAP row
  type: generic.GenericNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [lacap_sector, ie_energy_carrier, gpc_sector, scope]
  output_dimensions: [lacap_sector, ie_energy_carrier, gpc_sector, scope]
  input_nodes:
  - id: lacap_emissions
    tags: [non_additive]
  - id: lacap_gpc_crosswalk
    tags: [non_additive]

# One step per GPC sector, so that the GPC page shows a card for each sector.
- id: gpc_i_stationary_energy_emissions
  name_en: I. Stationary energy
  color: '#4e79a7'
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [gpc_sector, scope]
  output_dimensions: [gpc_sector, scope]
  input_nodes:
  - id: gpc_emissions_by_lacap_row
    from_dimensions:
    - id: lacap_sector
      flatten: true
    - id: ie_energy_carrier
      flatten: true
    - id: gpc_sector
      categories: [i11, i12, i13, i21, i22, i23, i31, i32, i33, i41, i42, i43, i51, i52, i53, i61, i62, i63, i71, i81]
  output_nodes: [gpc_emissions]

- id: gpc_ii_transportation_emissions
  name_en: II. Transportation
  color: '#e15759'
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [gpc_sector, scope]
  output_dimensions: [gpc_sector, scope]
  input_nodes:
  - id: gpc_emissions_by_lacap_row
    from_dimensions:
    - id: lacap_sector
      flatten: true
    - id: ie_energy_carrier
      flatten: true
    - id: gpc_sector
      categories: [ii11, ii12, ii13, ii21, ii22, ii23, ii31, ii32, ii33, ii41, ii42, ii43, ii51, ii52, ii53]
  output_nodes: [gpc_emissions]

- id: gpc_iii_waste_emissions
  name_en: III. Waste
  color: '#b07aa1'
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [gpc_sector, scope]
  output_dimensions: [gpc_sector, scope]
  input_nodes:
  - id: gpc_emissions_by_lacap_row
    from_dimensions:
    - id: lacap_sector
      flatten: true
    - id: ie_energy_carrier
      flatten: true
    - id: gpc_sector
      categories: [iii11, iii12, iii21, iii22, iii31, iii32, iii41, iii42]
  output_nodes: [gpc_emissions]

- id: gpc_iv_ippu_emissions
  name_en: IV. Industrial processes and product use
  description_en: Counted in BASIC+ only.
  color: '#9c755f'
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [gpc_sector, scope]
  output_dimensions: [gpc_sector, scope]
  input_nodes:
  - id: gpc_emissions_by_lacap_row
    from_dimensions:
    - id: lacap_sector
      flatten: true
    - id: ie_energy_carrier
      flatten: true
    - id: gpc_sector
      categories: [iv1, iv2]
  output_nodes: [gpc_emissions]

- id: gpc_v_afolu_emissions
  name_en: V. Agriculture, forestry and other land use
  description_en: Counted in BASIC+ only.
  color: '#59a14f'
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [gpc_sector, scope]
  output_dimensions: [gpc_sector, scope]
  input_nodes:
  - id: gpc_emissions_by_lacap_row
    from_dimensions:
    - id: lacap_sector
      flatten: true
    - id: ie_energy_carrier
      flatten: true
    - id: gpc_sector
      categories: [v1, v2, v3]
  output_nodes: [gpc_emissions]

- id: gpc_emissions
  name_en: Dublin City emissions (GPC, BASIC+)
  description_en: The same emissions arranged by the GHG Protocol for Cities (GPC) sectors and scopes,
    for CDP-ICLEI Track reporting. Energy generation in the city (I.4.4) is reported separately.
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt/a
  is_outcome: true
  input_dimensions: [gpc_sector, scope]
  output_dimensions: [gpc_sector, scope]
  output_nodes:
  - id: gpc_basic_emissions
    from_dimensions:
    - id: gpc_sector
      categories: [i11, i12, i13, i21, i22, i23, i31, i32, i33, i41, i42, i43, i51, i52, i53, i61, i62, i63,
        i71, i81, ii11, ii12, ii13, ii21, ii22, ii23, ii31, ii32, ii33, ii41, ii42, ii43, ii51, ii52, ii53,
        iii11, iii12, iii21, iii22, iii31, iii32, iii41, iii42]
      flatten: true

- id: gpc_basic_emissions
  name_en: Dublin City emissions (GPC BASIC)
  description_en: GPC BASIC = stationary energy, transport and waste (sectors I–III). BASIC+ adds
    industrial processes, product use and land (IV–V).
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt/a
  is_outcome: true
  input_dimensions: [scope]
  output_dimensions: [scope]

