    tags: [non_additive]
    to_dimensions: []

- id: r3_1_dublin_district_heating
  name_en: R3.1 Dublin District Heating System
  description_en: Heat from the Poolbeg waste-to-energy plant (90 MW, up to 50,000–80,000 homes)
    replaces gas heating. KPI is home-equivalents connected. EUR 42.7M in 2024–26. Plan p.25 and
    p.39; national CAP BE/23/27, BE/23/28.
  type: simple.AdditiveAction
  group: resilient_city
  quantity: number
  unit: dimensionless
