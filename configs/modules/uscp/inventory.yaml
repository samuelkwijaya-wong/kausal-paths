- id: industrial_other_fuel_use
  name: Industrial other fuel use
  type: simple.MultiplicativeNode
  quantity: energy
  unit: MMBtu/a
  input_nodes:
  - id: industrial_other_fuel_use_inventory
    tags: [non_additive]
  - id: jobs
    tags: [ratio_to_last_historical_value, indifferent_history_ratio, non_additive]
