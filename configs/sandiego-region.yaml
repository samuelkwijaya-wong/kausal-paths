  type: simple.MultiplicativeNode
  quantity: emissions
  unit: t/a
  input_nodes:
  - onroad_vmt
  - onroad_emission_factor
- id: onroad_emissions
  name: On-road transportation emissions
  type: simple.AdditiveNode
  quantity: emissions
  unit: t/a
  description: Passenger cars, light-duty and heavy-duty vehicles.
  input_nodes:
