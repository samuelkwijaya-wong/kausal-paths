- id: onroad_emission_factor
  name: On-road average emission factor
  type: simple.AdditiveNode
  quantity: emission_factor
  unit: g/mi
  description: 2022 average emission factor for all vehicles, derived from Roadmap Appendix B Tables B.3 and B.8 (emissions
    ÷ annual VMT). Held at the 2022 level; state and federal vehicle rules are an action.
  historical_values:
  - - 2022
    - 371.9625
  forecast_values:
  - - 2045
    - 371.9625
  input_dataset_processors:
  - LinearInterpolation
- id: onroad_tailpipe_emissions
