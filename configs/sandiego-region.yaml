- id: onroad_vmt
  name: On-road vehicle miles travelled
  type: simple.AdditiveNode
  quantity: mileage
  unit: Mmi/a
  description: SANDAG ABM15.2.1 weekday VMT (Roadmap Appendix B, Tables B.3 and B.8; Roadmap Appendix D, Table D.4) × 347
    weekdays per year.
  historical_values:
  - - 2022
    - 27102.83
  forecast_values:
  - - 2035
    - 25488.52
  - - 2045
    - 25439.76
  input_dataset_processors:
