- id: baseline
  name: Legislatively-adjusted business as usual
  all_actions_enabled: false
  param_values:
    emfac2025_vehicle_regulations.enabled: true
    rps_sdge.enabled: true
    rps_cca.enabled: true
    rps_da.enabled: true
    sb1383_organics_diversion.enabled: true
    sb1383_waste_composition.enabled: true
    landfill_methane_regulation.enabled: true
    rps_california_grid.enabled: true
- id: default
