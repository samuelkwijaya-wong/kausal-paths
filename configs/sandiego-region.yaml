  quantity: emission_factor
  unit: t/MWh
  description: Used to value added electricity demand from building electrification.
  input_nodes:
  - electricity_sales_emissions
  - electricity_sales_total
  params:
    formula: electricity_sales_emissions / electricity_sales_total
- id: additional_electricity_demand
