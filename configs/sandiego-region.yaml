  type: formula.FormulaNode
  quantity: emissions
  unit: t/a
  input_nodes:
  - natural_gas_combustion_emissions
  - natural_gas_leak_ratio
  params:
    formula: natural_gas_combustion_emissions * natural_gas_leak_ratio
- id: natural_gas_cogeneration_adjustment
  name: Cogeneration heat output
  type: simple.AdditiveNode
  quantity: emissions
