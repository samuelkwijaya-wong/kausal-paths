    tags:
    - arithmetic_inverse
  - id: rail_electric_emissions
    tags:
    - arithmetic_inverse
  output_nodes:
  - id: net_emissions
    to_dimensions:
    - id: sector
      categories:
      - electricity
  params:
    operations: add
- id: natural_gas_use
  name: Natural gas use
  type: simple.AdditiveNode
  quantity: energy
  unit: thm/a
  description: Metered sales net of gas used for on-site self-generation, derived from the emissions in Roadmap Appendix B
