# NetZeroPlanner, Irish LACAP variant (nzc-ie): demo instance with Dublin City data.
#
# Proof of concept for Cork City Council, Dublin City Council and NetZeroCities.
# One set of inputs gives three views:
# - lacap_emissions: Irish LACAP inventory (DECC Annex C sectors, Step 2), the headline goal
# - gpc_emissions / gpc_basic_emissions: GPC view for CDP-ICLEI reporting
# - net_emissions: the NetZeroCities Climate City Contract view, from nzc.yaml unchanged
#
# The Irish core (configs/modules/ie/lacap.yaml) also runs without nzc.yaml, see
# configs/ie-lacap-dublin.yaml (plan decision H). The views are shown side by side;
# only the Irish rows NZC does not model (industrial processes, F-gases, agriculture,
# LULUCF) are passed into NZC sector "other" through the crosswalk dataset.
#
# Status: the Irish views were computed and checked with the demo data. The NZC
# layer still reads nzc.yaml's own inputs (nzc/*), which are not yet Dublin data,
# and it has not been computed with this file. The nzc-ie/* datasets
# (configs/data/nzc-ie/*.csv) must be uploaded to the dataset repository first, e.g.
#   python tools/upload_new_dataset.py -i configs/data/nzc-ie/energy_inventory.csv -o nzc-ie --sources-csv configs/data/nzc-ie/sources.csv
# and the commit below updated to one that holds both nzc/* and nzc-ie/*.
id: nzc-ie
default_language: en
supported_languages: []
dataset_repo:
  url: https://github.com/kausaltech/dvctest.git
  commit: ed78d2d5522af1da60bb05a56cf90e534724ac7e  # TODO: update after uploading nzc-ie/* datasets
  dvc_remote: kausal-s3
name: Dublin City Climate Action Planner (NetZeroPlanner, Irish LACAP demo)
owner: Dublin City Council (demo)
theme_identifier: eu-netzerocities
target_year: 2030
model_end_year: 2050
reference_year: 2018
minimum_historical_year: 2018
maximum_historical_year: 2018
emission_unit: kt/a
emission_forecast_from: 2019
emission_dimensions: [scope, ghg, sector]
normalizations:
- normalizer_node: ie_population
  quantities:
  - id: emissions
    unit: t/cap/a
  - id: energy
    unit: MWh/cap/a
  default: false
features:
  baseline_visible_in_graphs: true
  show_significant_digits: 3
  maximum_fraction_digits: 1
  hide_node_details: false
  hide_scenario_editor: false
  show_refresh_prompt: false
  requires_authentication: false
  show_explanations: true

include:
- file: modules/ie/lacap.yaml
  allow_override: true
- file: nzc.yaml
  allow_override: true

params:
- id: municipality_name
  value: Dublin City
- id: discount_rate
  label_en: Discount rate
  value: 3.5
  min_value: 0
  max_value: 5
  unit: '%'
  is_visible: true
  is_customizable: false
- id: show_scenario_impacts
  label_en: Show scenario impacts instead of node outputs?
  value: false
  is_visible: false
  is_customizable: true
- id: statistical_correction
  label_en: Statistical correction
  value: true
  is_visible: true
  is_customizable: true
- id: use_observations
  value: false
  is_visible: false
  is_customizable: false
- id: measure_data_override
  value: false
  is_visible: false
  is_customizable: false
- id: measure_data_baseline_year_only
  value: true
  is_visible: false
  is_customizable: false

action_groups:
# Dublin City Council's plan structure (Irish core)
- id: resilient_city
  name_en: Resilient City
  color: '#4e79a7'
- id: resource_full_city
  name_en: Resource-Full City
  color: '#59a14f'
- id: social_city
  name_en: Social City
  color: '#f28e2b'
- id: national
  name_en: National measures (Dublin share)
  color: '#9c755f'
# NetZeroCities action groups (nzc.yaml)
- id: transport
  name_en: 'NZC 1. Transport'
  color: '#93c572'
- id: freight_transport
  name_en: 'NZC 2. Freight transport'
- id: buildings
  name_en: 'NZC 3. Buildings'
  color: '#32cd32'
- id: electricity
  name_en: 'NZC 4. Electricity'
  color: '#29ab87'
- id: waste
  name_en: 'NZC 5. Waste'
  color: '#50c878'
- id: scope_3
  name_en: 'NZC 6. Scope 3'
- id: reforestation
  name_en: 'NZC 7. Reforestation'

nodes:

# Headline goal on the LACAP view (plan decision B): -51% by 2030 vs 2018, net zero 2050.
# Goals are absolute values: 2,183.27 kt in 2018 (DCC CAP p.67) x 0.49 = 1,069.80 kt.
- id: lacap_emissions
  name_en: Dublin City emissions (LACAP inventory)
  description_en: |
    <p>Territorial emissions in the sectors of the DECC LACAP guidance (Annex C), with electricity
    reallocated to the sectors that use it (Step 2). This is the view the headline goal is measured on:
    −51% by 2030 compared with 2018, and climate neutrality by 2050.</p>
    <p>Demo data: the 2018 total (2,183,270 tCO2e) is from the Dublin City Climate Action Plan
    2024–2029, p.67. The split by sector and fuel is partly estimated; see the data notes.</p>
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt/a
  is_outcome: true
  input_dimensions: [lacap_sector, ie_energy_carrier]
  output_dimensions: [lacap_sector, ie_energy_carrier]
  goals:
  - label_en: National climate objective (−51% by 2030, neutral by 2050)
    is_main_goal: true
    linear_interpolation: true
    values:
    - year: 2018
      value: 2183.27
    - year: 2030
      value: 1069.80
    - year: 2050
      value: 0

# --- Crosswalk into NZC: Irish boundary residuals -> NZC sector "other" ---------

- id: lacap_nzc_crosswalk
  name_en: Crosswalk from LACAP to NZC
  description_en: Settings table that says which Irish inventory rows NZC does not model itself, and
    where they go in NZC's "other" sector. Territorial waste is not passed on, because NZC models the
    city's collected waste itself (scope 3).
  type: generic.GenericNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [lacap_sector, ie_energy_carrier, cost_type, scope, ghg]
  output_dimensions: [lacap_sector, ie_energy_carrier, cost_type, scope, ghg]
  input_datasets:
  - id: nzc-ie/crosswalk_lacap_nzc
    column: share
    forecast_from: 2019

- id: ie_residuals_for_nzc
  name_en: Irish inventory rows passed to NZC
  type: generic.GenericNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [lacap_sector, ie_energy_carrier, cost_type, scope, ghg]
  output_dimensions: [lacap_sector, ie_energy_carrier, cost_type, scope, ghg]
  input_nodes:
  - id: ie_direct_emissions
    tags: [non_additive]
  - id: lacap_nzc_crosswalk
    tags: [non_additive]
  output_nodes:
  - id: emissions_from_other_sectors
    from_dimensions:
    - id: lacap_sector
      flatten: true
    - id: ie_energy_carrier
      flatten: true

# Replaces nzc.yaml's node of the same id: the "other" sector now comes from the
# Irish inventory instead of the nzc/other_sectors input. Action a61 still acts on it.
- id: emissions_from_other_sectors
  name_en: Emissions from other sectors
  description_en: Industrial processes, F-gases, agriculture and land use from the Irish LACAP
    inventory (boundary residuals, see docs/nzp-city-inventory-compliance-pattern.md bucket C).
  type: generic.GenericNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [cost_type, scope, ghg]
  output_dimensions: [cost_type, scope, ghg]
  output_nodes:
  - id: net_emissions
    from_dimensions:
    - id: cost_type
      flatten: true
    to_dimensions:
    - id: scope
    - id: ghg
    - id: sector
      categories: [other]

pages:
- id: home
  name_en: Dublin City Climate Action Planner
  path: /
  type: emission
  outcome_node: lacap_emissions
  lead_title: Dublin City emissions, LACAP inventory
  lead_paragraph: |
    <p>Demonstration of NetZeroPlanner adapted to Irish Local Authority Climate Action Plans, with Dublin
    City data from the Climate Action Plan 2024–2029. The Irish inventory is the headline; the same
    inputs also give the GPC view for CDP-ICLEI and the NetZeroCities Climate City Contract view.</p>
    <p><strong>Demo data.</strong> The 2018 total is from the plan; the sector and fuel split and the size
    of most actions are estimates, marked in the data files.</p>
- id: nzc
  name_en: NetZeroCities view
  path: /nzc
  type: emission
  outcome_node: net_emissions
  lead_title: Climate City Contract view
  lead_paragraph: Emissions by scope and Climate City Contract sector, as in every NetZeroPlanner city.
  show_in_menus: true
- id: gpc
  name_en: GPC view (CDP-ICLEI)
  path: /gpc
  type: emission
  outcome_node: gpc_emissions
  lead_title: GPC view for CDP-ICLEI reporting
  lead_paragraph: The same emissions arranged by GHG Protocol for Cities sectors and scopes.
  show_in_menus: true
- id: council
  name_en: Council's own emissions
  path: /council
  type: outcome
  outcome_node: council_operations_emissions
  lead_title: Dublin City Council's own operations
  lead_paragraph: Buildings, public lighting and fleet, from the council's SEAI monitoring and reporting.
  show_in_menus: true

scenarios:
- id: baseline
  name_en: Baseline (no new actions)
  params:
  - id: show_scenario_impacts
    value: false
  - id: use_observations
    value: false
  - id: measure_data_baseline_year_only
    value: true

- id: default
  default: true
  name_en: Climate Action Plan 2024–2029
  all_actions_enabled: true
  params:
  - id: use_observations
    value: false
  - id: measure_data_baseline_year_only
    value: true

- id: progress_tracking
  name_en: Progress tracking
  all_actions_enabled: false
  is_selectable: true
  params:
  - id: use_observations
    value: true
  - id: measure_data_baseline_year_only
    value: false
  - id: a51_increase_waste_recycling.enabled  # Needed so that DatasetDifferenceAction works correctly (as in nzc.yaml).
    value: true
