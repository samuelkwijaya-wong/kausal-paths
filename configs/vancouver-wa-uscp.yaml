actions:

- id: clean_electricity_procurement
  name: 'Clean electricity procurement'
  description: 'ILLUSTRATIVE PLACEHOLDER for the sales demo: the trajectory below is not a published value and not a City of Vancouver commitment. Replace with cited figures from the Climate Action Framework before any external use. Template description: Community choice aggregation, utility green tariffs or similar programmes that supply community electricity from zero-carbon sources beyond the grid''s BAU trajectory. Causal path: reduces the electricity emission factor used for all community electricity, including electricity added by electrification and EV charging. Parameter: additional zero-carbon share of community electricity (%), by year. Default: none, no cited source yet. Overlaps: local solar reduces the electricity bought first; this share then applies to the rest. The grid trajectory must not already include this procurement.'
  type: simple.AdditiveAction
  group: electricity
  quantity: fraction
  unit: '%'
  historical_values: [[1990, 0.0], [2023, 0.0]]
  forecast_values: [[2024, 0.0], [2030, 20.0], [2040, 50.0], [2045, 50.0]]
  input_dataset_processors: [LinearInterpolation]

- id: residential_local_solar
  name: 'Residential rooftop and community solar'
  description: 'ILLUSTRATIVE PLACEHOLDER for the sales demo: the trajectory below is not a published value and not a City of Vancouver commitment. Replace with cited figures from the Climate Action Framework before any external use. Template description: New rooftop solar on homes and community solar subscribed by households, beyond what is installed in the inventory year. Causal path: subtracted from residential electricity use, after efficiency and electrification; the result cannot go below zero. Parameter: additional annual generation (MWh/a), by year. Default: none, no cited source yet. Overlaps: clean electricity procurement applies only to the electricity still bought.'
  type: simple.AdditiveAction
  group: electricity
  quantity: energy
  unit: 'MWh/a'
  historical_values: [[1990, 0.0], [2023, 0.0]]
  forecast_values: [[2024, 0.0], [2030, 20000.0], [2040, 60000.0], [2045, 60000.0]]
  input_dataset_processors: [LinearInterpolation]

- id: commercial_local_solar
  name: 'Commercial rooftop and community solar'
  description: 'ILLUSTRATIVE PLACEHOLDER for the sales demo: the trajectory below is not a published value and not a City of Vancouver commitment. Replace with cited figures from the Climate Action Framework before any external use. Template description: As residential local solar, for commercial, institutional and municipal buildings. Causal path: subtracted from commercial electricity use. Parameter: additional annual generation (MWh/a), by year. Default: none, no cited source yet.'
  type: simple.AdditiveAction
  group: electricity
  quantity: energy
  unit: 'MWh/a'
  historical_values: [[1990, 0.0], [2023, 0.0]]
  forecast_values: [[2024, 0.0], [2030, 15000.0], [2040, 40000.0], [2045, 40000.0]]
  input_dataset_processors: [LinearInterpolation]

- id: residential_efficiency_retrofits
  name: 'Residential energy efficiency retrofits'
  description: 'ILLUSTRATIVE PLACEHOLDER for the sales demo: the trajectory below is not a published value and not a City of Vancouver commitment. Replace with cited figures from the Climate Action Framework before any external use. Template description: Weatherisation, insulation and equipment upgrades in existing homes. Causal path: reduces residential electricity, natural gas and other fuel use by the same share. Parameter: community-wide reduction in residential energy use (%), by year, i.e. homes retrofitted times savings per home. Default: none, no cited source yet. Overlaps: applied before electrification, so electrification acts on the gas left after retrofits.'
  type: simple.AdditiveAction
  group: buildings
  quantity: fraction
  unit: '%'
  historical_values: [[1990, 0.0], [2023, 0.0]]
  forecast_values: [[2024, 0.0], [2030, 5.0], [2040, 15.0], [2045, 15.0]]
  input_dataset_processors: [LinearInterpolation]

- id: commercial_efficiency_retrofits
  name: 'Commercial energy efficiency retrofits'
  description: 'ILLUSTRATIVE PLACEHOLDER for the sales demo: the trajectory below is not a published value and not a City of Vancouver commitment. Replace with cited figures from the Climate Action Framework before any external use. Template description: Efficiency programmes in existing commercial, institutional and municipal buildings. Causal path: reduces commercial electricity, natural gas and other fuel use by the same share. Parameter: community-wide reduction in commercial energy use (%), by year. Default: none, no cited source yet. Overlaps: the building performance standard applies to what retrofits leave; enter only programme savings that the standard would not have required.'
