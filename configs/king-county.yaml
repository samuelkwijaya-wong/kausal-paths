- id: electricity_emissions
  name: Electricity
  type: generic.GenericNode
  quantity: emissions
  unit: t_co2e/a
  input_dimensions: [subsector]
  output_dimensions: [subsector]
  input_datasets:
  - id: king-county/ghg_inventory
    column: Value
    forecast_from: 2024
    filters:
    - column: subsector
      value: electricity
      drop_col: false
    - {column: utility, flatten: true}
    - {column: economic_sector, flatten: true}
    - {column: vehicle_type, flatten: true}
    - {column: moves_sector, flatten: true}
    - {column: fuel_type, flatten: true}
    - {column: livestock, flatten: true}
