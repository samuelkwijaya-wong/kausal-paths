  dvc_remote: kausal-s3
name: King County Greenhouse Gas Emissions
owner: King County
theme_identifier: us-kingcounty
target_year: 2030
model_end_year: 2050
reference_year: 2008
minimum_historical_year: 2008
maximum_historical_year: 2023
emission_unit: t_co2e/a
emission_forecast_from: 2024
emission_dimensions: [subsector]
